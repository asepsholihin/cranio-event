# For more information: https://laravel.com/docs/sail
version: '3'
services:
    app:
        platform: linux/amd64
        build:
            context: ./docker/8.1
            dockerfile: Dockerfile
            args:
                WWWGROUP: '1000'
        image: sail-8.1/app
        ports:
            - '8000:80'
            - '3000:3000'
        environment:
            WWWUSER: '1000'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: 'off'
            XDEBUG_CONFIG: 'client_host=host.docker.internal'
        volumes:
            - '.:/var/www/html:cached'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
    pgsql:
        image: 'postgres:13'
        ports:
            - '5432:5432'
        environment:
            PGPASSWORD: 'password'
            POSTGRES_DB: 'platform'
            POSTGRES_USER: 'sail'
            POSTGRES_PASSWORD: 'password'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "pg_isready", "-q", "-d", "umroh", "-U", "sail"]
            retries: 3
            timeout: 5s
    pgadmin:
        image: dpage/pgadmin4
        environment:
            - PGADMIN_DEFAULT_EMAIL=root@mail.com
            - PGADMIN_DEFAULT_PASSWORD=root
            - PGADMIN_DISABLE_POSTFIX
        ports:
            - "8001:80"
        depends_on:
            - pgsql
        volumes:
            - './docker/servers-pgadmin-config.json:/pgadmin4/servers.json'
        networks:
            - sail
    redis:
        image: 'redis:alpine'
        ports:
            - '6379:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s
    phpredisadmin:
        image: erikdubbelboer/phpredisadmin
        platform: linux/amd64
        links:
        - redis
        environment:
        - REDIS_1_HOST=redis
        - REDIS_1_PORT=6379
        - ADMIN_USER=root
        - ADMIN_PASS=root
        networks:
            - sail
        ports:
        - "8002:80"
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
